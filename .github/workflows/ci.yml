name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev python3-setuptools
        # Install SDL dependencies for pygame (headless mode)
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        # Set up virtual display for pygame
        sudo apt-get install -y xvfb

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install Python dependencies
      run: |
        uv sync
        # Install additional test dependencies
        uv add --dev pytest black flake8 bandit safety

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        uv run black --check --diff .

    - name: Run unit tests
      run: |
        # Set up virtual display for pygame tests
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        # Run tests using the project's test runner with uv
        uv run python run_tests.py
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy

    - name: Run tests with pytest (alternative)
      run: |
        # Also run with pytest for additional test discovery and reporting
        export DISPLAY=:99
        uv run pytest tests/ -v --tb=short
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync
        uv add --dev black flake8 bandit safety

    - name: Run security checks with bandit
      run: |
        uv run bandit -r . -f json -o bandit-report.json || true
        uv run bandit -r . --severity-level medium

    - name: Check for known security vulnerabilities
      run: |
        uv run safety check --json --output safety-report.json || true
        uv run safety check

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install build dependencies
      run: |
        uv sync
        uv add --dev build

    - name: Build package
      run: |
        uv run python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/