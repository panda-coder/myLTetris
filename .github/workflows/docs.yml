name: Documentation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev
        uv add --dev sphinx sphinx-rtd-theme pydoc-markdown

    - name: Generate API documentation
      run: |
        # Create docs directory
        mkdir -p docs/api
        
        # Generate module documentation
        uv run python -m pydoc -w tetris.game
        uv run python -m pydoc -w tetris.piece
        uv run python -m pydoc -w tetris.block
        uv run python -m pydoc -w tetris.runner
        uv run python -m pydoc -w tetris.constants
        
        # Move generated docs
        mv *.html docs/api/ 2>/dev/null || true
        
        # Create index file
        cat > docs/api/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>myLTetris API Documentation</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                h1 { color: #333; }
                ul { list-style-type: none; padding: 0; }
                li { margin: 10px 0; }
                a { text-decoration: none; color: #0066cc; }
                a:hover { text-decoration: underline; }
            </style>
        </head>
        <body>
            <h1>myLTetris API Documentation</h1>
            <p>Generated automatically from source code.</p>
            <ul>
                <li><a href="tetris.game.html">Game Module</a> - Main game logic and state management</li>
                <li><a href="tetris.piece.html">Piece Module</a> - Tetris piece definitions and operations</li>
                <li><a href="tetris.block.html">Block Module</a> - Individual block management</li>
                <li><a href="tetris.runner.html">Runner Module</a> - Game loop and event handling</li>
                <li><a href="tetris.constants.html">Constants Module</a> - Game configuration and constants</li>
            </ul>
        </body>
        </html>
        EOF

    - name: Generate test coverage badge
      run: |
        # Create a simple coverage badge
        mkdir -p docs/badges
        cat > docs/badges/coverage.svg << 'EOF'
        <svg xmlns="http://www.w3.org/2000/svg" width="104" height="20">
          <linearGradient id="b" x2="0" y2="100%">
            <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
            <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <mask id="a">
            <rect width="104" height="20" rx="3" fill="#fff"/>
          </mask>
          <g mask="url(#a)">
            <path fill="#555" d="M0 0h63v20H0z"/>
            <path fill="#4c1" d="M63 0h41v20H63z"/>
            <path fill="url(#b)" d="M0 0h104v20H0z"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
            <text x="325" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="530">coverage</text>
            <text x="325" y="140" transform="scale(.1)" textLength="530">coverage</text>
            <text x="825" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="310">97%</text>
            <text x="825" y="140" transform="scale(.1)" textLength="310">97%</text>
          </g>
        </svg>
        EOF

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs