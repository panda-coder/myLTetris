name: Code Quality

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync
        uv add --dev black flake8 isort mypy bandit

    - name: Check code formatting with Black
      run: |
        uv run black --check --diff .

    - name: Check import sorting with isort
      run: |
        uv run isort --check-only --diff .

    - name: Lint with flake8
      run: |
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type checking with mypy
      run: |
        uv run mypy tetris/ --ignore-missing-imports || true

    - name: Security check with bandit
      run: |
        uv run bandit -r . --severity-level medium

    - name: Check for common security issues
      run: |
        # Check for hardcoded secrets (basic patterns)
        echo "Checking for potential security issues..."
        if grep -r "password\|secret\|key\|token" --include="*.py" . | grep -v "test" | grep -v ".git"; then
          echo "⚠️  Potential hardcoded secrets found. Please review."
        else
          echo "✅ No obvious hardcoded secrets found."
        fi

    - name: Code complexity analysis
      run: |
        uv add --dev radon
        echo "## Code Complexity Report" > complexity_report.md
        echo "### Cyclomatic Complexity:" >> complexity_report.md
        uv run radon cc tetris/ -s >> complexity_report.md
        echo "" >> complexity_report.md
        echo "### Maintainability Index:" >> complexity_report.md
        uv run radon mi tetris/ -s >> complexity_report.md

    - name: Upload complexity report
      uses: actions/upload-artifact@v4
      with:
        name: complexity-report
        path: complexity_report.md

  format:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync
        uv add --dev black isort

    - name: Format code with Black
      run: |
        uv run black .

    - name: Sort imports with isort
      run: |
        uv run isort .

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "Auto-format code with Black and isort"
        git push